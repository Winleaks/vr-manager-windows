name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

jobs:
  release:
    runs-on: windows-latest

    env:
      VR_HUB_GOOGLE_CLIENT_ID: ${{ secrets.VR_HUB_GOOGLE_CLIENT_ID }}

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Run Lint
        run: npm run lint

      - name: Validate Build Secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VR_HUB_GOOGLE_CLIENT_ID)) {
            throw "Google Drive build configuration is missing."
          }

      - name: Build App Assets
        run: npx vite build

      - name: Build Electron Windows Package
        run: npx electron-builder --win --x64 -p never

      - name: Read Package Version
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: CHANGELOG.md
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
