name: Verify client billing on Windows
on:
  push:
    branches: ['razvancristofor/client-billing-publication']
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      VR_HUB_GOOGLE_CLIENT_ID: ${{ secrets.VR_HUB_GOOGLE_CLIENT_ID }}
      VR_HUB_GOOGLE_CLIENT_SECRET: ${{ secrets.VR_HUB_GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm run build:windows-documents
      - run: npm run test:windows-documents
      - run: npx vite build
      - run: npx electron-builder --win --x64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: vr-hub-billing-windows-verification
          path: release/*.exe
          retention-days: 7
